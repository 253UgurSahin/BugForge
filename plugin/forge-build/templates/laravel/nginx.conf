# nginx for Laravel: serves the files in public/ and sends everything else to PHP-FPM (the app service).
server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 20m;
    # Redirects (/docs to /docs/) send only the path. A full URL would name nginx's own address,
    # http://<host>:8080/, which nobody can reach behind the HTTPS proxy in RUN.md.
    absolute_redirect off;

    # Security headers on every response. The CSP allows only files from this site. Loosen it per need,
    # one source at a time: Stripe.js needs https://js.stripe.com in script-src and frame-src.
    # Livewire and Alpine need 'unsafe-eval' in script-src unless you use their CSP-safe build.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Vite's files have a hash in their name and never change: browsers may keep them for a year.
    location /build/ {
        expires 1y;
        try_files $uri =404;
    }

    # PWA: the service worker must always be checked for a new version.
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    # PWA: nginx has no type for .webmanifest, so the manifest would go out as octet-stream.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # No dotfiles (.env, .git) and no other PHP files, even if one slips into public/.
    location ~ /\.(?!well-known).* {
        return 404;
    }
    location ~ \.php$ {
        return 404;
    }
}
