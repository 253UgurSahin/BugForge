# nginx for a static site or single-page app built by Vite into dist/.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # Redirects (/docs to /docs/) send only the path. A full URL would name nginx's own address,
    # http://<host>:8080/, which nobody can reach behind the HTTPS proxy in RUN.md.
    absolute_redirect off;

    # Security headers on every response. The CSP allows only files from this site, plus calls
    # to the same site. Calling an API on another domain: add it to connect-src.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Vite's files have a hash in their name and never change: browsers may keep them for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # PWA: nginx has no type for .webmanifest, so the manifest would go out as octet-stream.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
        try_files $uri =404;
    }

    # Everything else (index.html, sw.js) is checked for a new version on each visit.
    # Unknown paths get index.html, so a refresh on /settings works in a single-page app.
    # A multi-page site without a router: use `try_files $uri $uri/ $uri.html =404;` instead.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # No dotfiles, even if one slips into dist/.
    location ~ /\.(?!well-known).* {
        return 404;
    }
}
