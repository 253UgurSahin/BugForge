# Next.js: app (Node, standalone server) -> db (PostgreSQL).
# Start: docker compose up -d --build --wait, then open http://localhost:8080. RUN.md has the rest.
# Settings and secrets come from .env (copy .env.example). Nothing secret is written in this file.

services:
  app:
    build: .
    env_file: .env
    environment:
      # Made from the DB_ parts in .env, so the password is written in one place only.
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    ports:
      - "127.0.0.1:8080:3000"  # this machine only; a reverse proxy with HTTPS goes in front (RUN.md)
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s  # migrations run before the server answers
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql  # PostgreSQL 18 and newer; 17 and older use /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # No ports: only the app reaches the database, by its name "db".

  # Development only: catches every email; inbox at http://localhost:8025.
  # Starts only with COMPOSE_PROFILES=dev in .env (see .env.example).
  mailpit:
    image: axllent/mailpit:v1.32
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  db-data:
